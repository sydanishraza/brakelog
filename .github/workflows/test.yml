name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 still ships setup-python builds for 3.8
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-22.04, python: "3.9" }
          - { os: ubuntu-22.04, python: "3.10" }
          - { os: ubuntu-22.04, python: "3.11" }
          - { os: ubuntu-22.04, python: "3.12" }
          - { os: ubuntu-22.04, python: "3.13" }
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
